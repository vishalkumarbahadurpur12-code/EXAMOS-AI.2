<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>EXAMOS AI — Admin Panel</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #090b18;
      color: white;
      min-height: 100vh;
    }

    button {
      border: none;
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    /* LOGIN */

    #loginPage {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: #171b35;
      border: 1px solid #292f55;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 8px;
      background: linear-gradient(90deg,#8b5cf6,#4f7cff);
      -webkit-background-clip: text;
      color: transparent;
    }

    .subtitle {
      text-align: center;
      color: #9da4c7;
      margin-bottom: 25px;
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border-radius: 12px;
      border: 1px solid #343b68;
      background: #0f1225;
      color: white;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #8b5cf6;
    }

    .primary-btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      background: linear-gradient(90deg,#8b5cf6,#4f7cff);
      color: white;
      font-size: 16px;
      font-weight: 700;
    }

    .error {
      color: #ff6b81;
      text-align: center;
      margin-top: 12px;
      font-size: 14px;
    }

    /* ADMIN */

    #adminPage {
      min-height: 100vh;
    }

    .topbar {
      height: 70px;
      padding: 0 18px;
      background: #11142a;
      border-bottom: 1px solid #292f55;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .top-title {
      font-size: 20px;
      font-weight: 700;
    }

    .logout-btn {
      background: #292f55;
      color: white;
      padding: 9px 14px;
      border-radius: 10px;
    }

    .container {
      width: 100%;
      max-width: 850px;
      margin: auto;
      padding: 20px;
    }

    /* DASHBOARD */

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(2,1fr);
      gap: 14px;
      margin-bottom: 25px;
    }

    .dashboard-card {
      background: #171b35;
      border: 1px solid #292f55;
      padding: 20px;
      border-radius: 16px;
    }

    .dashboard-card h3 {
      color: #9da4c7;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .dashboard-card strong {
      font-size: 27px;
    }

    /* CURRICULUM */

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 18px;
    }

    .section-title {
      font-size: 24px;
      font-weight: 800;
    }

    .path {
      color: #8f97bb;
      font-size: 13px;
      margin-top: 5px;
      line-height: 1.5;
    }

    .add-btn {
      background: linear-gradient(90deg,#8b5cf6,#4f7cff);
      color: white;
      padding: 11px 15px;
      border-radius: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .back-btn {
      background: #202644;
      color: white;
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 16px;
    }

    .items {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .item {
      background: #171b35;
      border: 1px solid #292f55;
      border-radius: 15px;
      padding: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: .2s;
    }

    .item:hover {
      border-color: #6d5bd0;
    }

    .item-main {
      min-width: 0;
      flex: 1;
      cursor: pointer;
    }

    .item-name {
      font-size: 16px;
      font-weight: 700;
      word-break: break-word;
    }

    .item-sub {
      font-size: 12px;
      color: #8f97bb;
      margin-top: 5px;
    }

    .arrow {
      color: #8b5cf6;
      font-size: 20px;
    }

    .actions {
      display: flex;
      gap: 7px;
    }

    .small-btn {
      padding: 8px 10px;
      border-radius: 8px;
      color: white;
      background: #272d50;
      font-size: 12px;
    }

    .delete-btn {
      background: #512638;
    }

    .empty {
      text-align: center;
      padding: 45px 20px;
      background: #11142a;
      border: 1px dashed #343b68;
      border-radius: 16px;
      color: #858cab;
    }

    .empty strong {
      display: block;
      color: white;
      margin-bottom: 7px;
      font-size: 17px;
    }

    /* MODAL */

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.7);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 100;
    }

    .modal-box {
      width: 100%;
      max-width: 430px;
      background: #171b35;
      border: 1px solid #343b68;
      border-radius: 18px;
      padding: 22px;
    }

    .modal-title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 18px;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 5px;
    }

    .modal-actions button {
      flex: 1;
      padding: 13px;
      border-radius: 11px;
      font-weight: 700;
    }

    .cancel-btn {
      background: #292f55;
      color: white;
    }

    .save-btn {
      background: linear-gradient(90deg,#8b5cf6,#4f7cff);
      color: white;
    }

    /* LOADING */

    #loading {
      position: fixed;
      inset: 0;
      background: rgba(9,11,24,.9);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      font-size: 18px;
    }

    .spinner {
      width: 30px;
      height: 30px;
      border: 3px solid #343b68;
      border-top-color: #8b5cf6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 12px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* MOBILE */

    @media(max-width:600px) {

      .container {
        padding: 15px;
      }

      .section-title {
        font-size: 21px;
      }

      .dashboard-grid {
        grid-template-columns: 1fr 1fr;
      }

      .item {
        padding: 13px;
      }

      .actions {
        flex-direction: column;
      }

      .small-btn {
        padding: 7px 9px;
      }

      .add-btn {
        padding: 10px 12px;
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <!-- LOADING -->

  <div id="loading" class="hidden">
    <div class="spinner"></div>
    <span>Loading...</span>
  </div>


  <!-- LOGIN -->

  <section id="loginPage">

    <div class="login-box">

      <div class="logo">EXAMOS AI</div>

      <div class="subtitle">
        Admin Panel
      </div>

      <input
        type="email"
        id="email"
        placeholder="Admin Email"
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
      >

      <button
        class="primary-btn"
        id="loginBtn"
      >
        Login
      </button>

      <div
        id="loginError"
        class="error"
      ></div>

    </div>

  </section>


  <!-- ADMIN -->

  <section
    id="adminPage"
    class="hidden"
  >

    <header class="topbar">

      <div class="top-title">
        EXAMOS AI Admin
      </div>

      <button
        class="logout-btn"
        id="logoutBtn"
      >
        Logout
      </button>

    </header>


    <main class="container">

      <!-- DASHBOARD -->

      <div id="dashboardSection">

        <div class="dashboard-grid">

          <div class="dashboard-card">
            <h3>Boards</h3>
            <strong id="boardCount">0</strong>
          </div>

          <div class="dashboard-card">
            <h3>Students</h3>
            <strong>0</strong>
          </div>

          <div class="dashboard-card">
            <h3>Tests</h3>
            <strong>0</strong>
          </div>

          <div class="dashboard-card">
            <h3>AI Usage</h3>
            <strong>0</strong>
          </div>

        </div>

      </div>


      <!-- CURRICULUM -->

      <section id="curriculumSection">

        <button
          id="backBtn"
          class="back-btn hidden"
        >
          ← Back
        </button>


        <div class="section-head">

          <div>
            <div
              id="pageTitle"
              class="section-title"
            >
              Boards
            </div>

            <div
              id="breadcrumb"
              class="path"
            >
              Curriculum
            </div>
          </div>

          <button
            id="addBtn"
            class="add-btn"
          >
            + Add Board
          </button>

        </div>


        <div
          id="items"
          class="items"
        ></div>

      </section>

    </main>

  </section>


  <!-- MODAL -->

  <div
    id="modal"
    class="modal hidden"
  >

    <div class="modal-box">

      <div
        id="modalTitle"
        class="modal-title"
      >
        Add Board
      </div>

      <input
        id="itemName"
        placeholder="Name"
      >

      <input
        id="itemCode"
        placeholder="Code (optional)"
      >

      <select
        id="streamSelect"
        class="hidden"
      >
        <option value="">General</option>
        <option value="Science">Science</option>
        <option value="Commerce">Commerce</option>
        <option value="Arts">Arts</option>
      </select>

      <div class="modal-actions">

        <button
          id="cancelBtn"
          class="cancel-btn"
        >
          Cancel
        </button>

        <button
          id="saveBtn"
          class="save-btn"
        >
          Save
        </button>

      </div>

    </div>

  </div>


  <script type="module">

    import {
      auth,
      db
    } from "./firebase-config.js";

    import {
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

    import {
      collection,
      doc,
      getDoc,
      getDocs,
      addDoc,
      updateDoc,
      deleteDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";


    /* =========================
       ELEMENTS
    ========================= */

    const loginPage =
      document.getElementById("loginPage");

    const adminPage =
      document.getElementById("adminPage");

    const loginBtn =
      document.getElementById("loginBtn");

    const logoutBtn =
      document.getElementById("logoutBtn");

    const loginError =
      document.getElementById("loginError");

    const loading =
      document.getElementById("loading");

    const pageTitle =
      document.getElementById("pageTitle");

    const breadcrumb =
      document.getElementById("breadcrumb");

    const items =
      document.getElementById("items");

    const addBtn =
      document.getElementById("addBtn");

    const backBtn =
      document.getElementById("backBtn");

    const modal =
      document.getElementById("modal");

    const modalTitle =
      document.getElementById("modalTitle");

    const itemName =
      document.getElementById("itemName");

    const itemCode =
      document.getElementById("itemCode");

    const streamSelect =
      document.getElementById("streamSelect");

    const cancelBtn =
      document.getElementById("cancelBtn");

    const saveBtn =
      document.getElementById("saveBtn");

    const boardCount =
      document.getElementById("boardCount");


    /* =========================
       STATE
    ========================= */

    let currentLevel = "boards";

    let currentBoard = null;
    let currentClass = null;
    let currentSubject = null;
    let currentChapter = null;

    let editingId = null;


    /* =========================
       FIREBASE LOADING
    ========================= */

    function showLoading() {
      loading.classList.remove("hidden");
    }

    function hideLoading() {
      loading.classList.add("hidden");
    }


    /* =========================
       ADMIN AUTH
    ========================= */

    loginBtn.addEventListener(
      "click",
      async () => {

        loginError.textContent = "";

        const email =
          document.getElementById("email").value.trim();

        const password =
          document.getElementById("password").value;

        if (!email || !password) {

          loginError.textContent =
            "Email और password डालें।";

          return;
        }

        try {

          showLoading();

          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );

        } catch (error) {

          loginError.textContent =
            error.message;

        } finally {

          hideLoading();

        }

      }
    );


    logoutBtn.addEventListener(
      "click",
      async () => {

        await signOut(auth);

      }
    );


    onAuthStateChanged(
      auth,
      async (user) => {

        if (!user) {

          loginPage.classList.remove("hidden");
          adminPage.classList.add("hidden");

          return;
        }

        try {

          showLoading();

          const adminRef =
            doc(db, "admins", user.uid);

          const adminSnap =
            await getDoc(adminRef);

          if (
            !adminSnap.exists() ||
            adminSnap.data().role !== "admin"
          ) {

            await signOut(auth);

            loginError.textContent =
              "आपके पास Admin access नहीं है।";

            return;
          }

          loginPage.classList.add("hidden");
          adminPage.classList.remove("hidden");

          await showBoards();

        } catch (error) {

          console.error(error);

          await signOut(auth);

          loginError.textContent =
            "Admin verification failed.";

        } finally {

          hideLoading();

        }

      }
    );


    /* =========================
       FIRESTORE PATH
    ========================= */

    function getCurrentCollection() {

      if (currentLevel === "boards") {

        return collection(
          db,
          "boards"
        );

      }

      if (currentLevel === "classes") {

        return collection(
          db,
          "boards",
          currentBoard.id,
          "classes"
        );

      }

      if (currentLevel === "subjects") {

        return collection(
          db,
          "boards",
          currentBoard.id,
          "classes",
          currentClass.id,
          "subjects"
        );

      }

      if (currentLevel === "chapters") {

        return collection(
          db,
          "boards",
          currentBoard.id,
          "classes",
          currentClass.id,
          "subjects",
          currentSubject.id,
          "chapters"
        );

      }

      if (currentLevel === "topics") {

        return collection(
          db,
          "boards",
          currentBoard.id,
          "classes",
          currentClass.id,
          "subjects",
          currentSubject.id,
          "chapters",
          currentChapter.id,
          "topics"
        );

      }

    }


    /* =========================
       SORTING
    ========================= */

    function sortItems(data) {

      return data.sort(
        (a,b) => {

          const aOrder =
            typeof a.order === "number"
              ? a.order
              : 999999999;

          const bOrder =
            typeof b.order === "number"
              ? b.order
              : 999999999;

          if (aOrder !== bOrder) {

            return aOrder - bOrder;

          }

          return (
            (a.name || "")
              .localeCompare(
                b.name || "",
                undefined,
                {
                  numeric: true,
                  sensitivity: "base"
                }
              )
          );

        }
      );

    }


    /* =========================
       LOAD ITEMS
    ========================= */

    async function loadItems() {

      showLoading();

      try {

        const snap =
          await getDocs(
            getCurrentCollection()
          );

        const data = [];

        snap.forEach(
          d => {

            data.push({
              id: d.id,
              ...d.data()
            });

          }
        );

        return sortItems(data);

      } finally {

        hideLoading();

      }

    }


    /* =========================
       SHOW BOARDS
    ========================= */

    async function showBoards() {

      currentLevel = "boards";

      currentBoard = null;
      currentClass = null;
      currentSubject = null;
      currentChapter = null;

      pageTitle.textContent =
        "Boards";

      breadcrumb.textContent =
        "Curriculum";

      addBtn.textContent =
        "+ Add Board";

      backBtn.classList.add("hidden");

      itemCode.classList.remove("hidden");
      streamSelect.classList.add("hidden");

      const data =
        await loadItems();

      boardCount.textContent =
        data.length;

      renderItems(data);

    }


    /* =========================
       SHOW CLASSES
    ========================= */

    async function showClasses(board) {

      currentLevel = "classes";

      currentBoard = board;

      currentClass = null;
      currentSubject = null;
      currentChapter = null;

      pageTitle.textContent =
        "Classes";

      breadcrumb.textContent =
        `Curriculum › ${board.name}`;

      addBtn.textContent =
        "+ Add Class";

      backBtn.classList.remove("hidden");

      itemCode.classList.add("hidden");
      streamSelect.classList.add("hidden");

      const data =
        await loadItems();

      renderItems(data);

    }


    /* =========================
       SHOW SUBJECTS
    ========================= */

    async function showSubjects(cls) {

      currentLevel = "subjects";

      currentClass = cls;

      currentSubject = null;
      currentChapter = null;

      pageTitle.textContent =
        "Subjects";

      breadcrumb.textContent =
        `Curriculum › ${currentBoard.name} › ${cls.name}`;

      addBtn.textContent =
        "+ Add Subject";

      backBtn.classList.remove("hidden");

      itemCode.classList.add("hidden");
      streamSelect.classList.remove("hidden");

      const data =
        await loadItems();

      renderItems(data);

    }


    /* =========================
       SHOW CHAPTERS
    ========================= */

    async function showChapters(subject) {

      currentLevel = "chapters";

      currentSubject = subject;

      currentChapter = null;

      pageTitle.textContent =
        "Chapters";

      breadcrumb.textContent =
        `Curriculum › ${currentBoard.name} › ${currentClass.name} › ${subject.name}`;

      addBtn.textContent =
        "+ Add Chapter";

      backBtn.classList.remove("hidden");

      itemCode.classList.add("hidden");
      streamSelect.classList.add("hidden");

      const data =
        await loadItems();

      renderItems(data);

    }


    /* =========================
       SHOW TOPICS
    ========================= */

    async function showTopics(chapter) {

      currentLevel = "topics";

      currentChapter = chapter;

      pageTitle.textContent =
        "Topics";

      breadcrumb.textContent =
        `Curriculum › ${currentBoard.name} › ${currentClass.name} › ${currentSubject.name} › ${chapter.name}`;

      addBtn.textContent =
        "+ Add Topic";

      backBtn.classList.remove("hidden");

      itemCode.classList.add("hidden");
      streamSelect.classList.add("hidden");

      const data =
        await loadItems();

      renderItems(data);

    }


    /* =========================
       RENDER
    ========================= */

    function renderItems(data) {

      items.innerHTML = "";

      if (!data.length) {

        const empty =
          document.createElement("div");

        empty.className = "empty";

        empty.innerHTML = `
          <strong>अभी कुछ नहीं है</strong>
          <span>
            ऊपर दिए गए Add button से नया ${getSingularName()} बनाएं।
          </span>
        `;

        items.appendChild(empty);

        return;

      }


      data.forEach(
        item => {

          const box =
            document.createElement("div");

          box.className = "item";


          const main =
            document.createElement("div");

          main.className =
            "item-main";


          const name =
            document.createElement("div");

          name.className =
            "item-name";

          name.textContent =
            item.name || "Unnamed";


          const sub =
            document.createElement("div");

          sub.className =
            "item-sub";

          if (currentLevel === "boards") {

            sub.textContent =
              item.code
                ? `Code: ${item.code}`
                : "Board";

          }

          else if (currentLevel === "classes") {

            sub.textContent =
              item.classNumber
                ? `Class ${item.classNumber}`
                : "Class";

          }

          else if (currentLevel === "subjects") {

            sub.textContent =
              item.stream
                ? item.stream
                : "General";

          }

          else if (currentLevel === "chapters") {

            sub.textContent =
              item.chapterNumber
                ? `Chapter ${item.chapterNumber}`
                : "Chapter";

          }

          else {

            sub.textContent =
              "Topic";

          }


          main.appendChild(name);
          main.appendChild(sub);


          const actions =
            document.createElement("div");

          actions.className =
            "actions";


          const edit =
            document.createElement("button");

          edit.className =
            "small-btn";

          edit.textContent =
            "Edit";

          edit.addEventListener(
            "click",
            (e) => {

              e.stopPropagation();

              openEditModal(item);

            }
          );


          const del =
            document.createElement("button");

          del.className =
            "small-btn delete-btn";

          del.textContent =
            "Delete";

          del.addEventListener(
            "click",
            (e) => {

              e.stopPropagation();

              deleteItem(item);

            }
          );


          actions.appendChild(edit);
          actions.appendChild(del);


          box.appendChild(main);
          box.appendChild(actions);


          if (
            currentLevel !== "topics"
          ) {

            const arrow =
              document.createElement("span");

            arrow.className =
              "arrow";

            arrow.textContent =
              "›";

            box.appendChild(arrow);

          }


          main.addEventListener(
            "click",
            () => {

              if (currentLevel === "boards") {

                showClasses(item);

              }

              else if (currentLevel === "classes") {

                showSubjects(item);

              }

              else if (currentLevel === "subjects") {

                showChapters(item);

              }

              else if (currentLevel === "chapters") {

                showTopics(item);

              }

            }
          );


          items.appendChild(box);

        }
      );

    }


    /* =========================
       SINGULAR NAME
    ========================= */

    function getSingularName() {

      if (currentLevel === "boards")
        return "Board";

      if (currentLevel === "classes")
        return "Class";

      if (currentLevel === "subjects")
        return "Subject";

      if (currentLevel === "chapters")
        return "Chapter";

      return "Topic";

    }


    /* =========================
       ADD BUTTON
    ========================= */

    addBtn.addEventListener(
      "click",
      () => {

        openAddModal();

      }
    );


    /* =========================
       OPEN ADD MODAL
    ========================= */

    function openAddModal() {

      editingId = null;

      modalTitle.textContent =
        `Add ${getSingularName()}`;

      itemName.value = "";
      itemCode.value = "";

      if (currentLevel === "subjects") {

        streamSelect.classList.remove("hidden");

      } else {

        streamSelect.classList.add("hidden");

      }

      modal.classList.remove("hidden");

      setTimeout(
        () => itemName.focus(),
        100
      );

    }


    /* =========================
       OPEN EDIT MODAL
    ========================= */

    function openEditModal(item) {

      editingId = item.id;

      modalTitle.textContent =
        `Edit ${getSingularName()}`;

      itemName.value =
        item.name || "";

      itemCode.value =
        item.code || "";

      if (currentLevel === "subjects") {

        streamSelect.classList.remove("hidden");

        streamSelect.value =
          item.stream || "";

      } else {

        streamSelect.classList.add("hidden");

      }

      modal.classList.remove("hidden");

      setTimeout(
        () => itemName.focus(),
        100
      );

    }


    /* =========================
       SAVE
    ========================= */

    saveBtn.addEventListener(
      "click",
      async () => {

        const name =
          itemName.value.trim();

        if (!name) {

          alert(
            `${getSingularName()} का नाम डालें।`
          );

          return;

        }

        showLoading();

        try {

          const data = {
            name: name,
            updatedAt: serverTimestamp()
          };


          /* BOARD */

          if (
            currentLevel === "boards"
          ) {

            data.code =
              itemCode.value.trim();

          }


          /* CLASS */

          if (
            currentLevel === "classes"
          ) {

            const match =
              name.match(/\d+/);

            if (match) {

              data.classNumber =
                Number(match[0]);

              data.order =
                Number(match[0]);

            } else {

              data.order =
                Date.now();

            }

          }


          /* SUBJECT */

          if (
            currentLevel === "subjects"
          ) {

            data.stream =
              streamSelect.value || "General";

            data.order =
              Date.now();

          }


          /* CHAPTER */

          if (
            currentLevel === "chapters"
          ) {

            const match =
              name.match(/\d+/);

            if (match) {

              data.chapterNumber =
                Number(match[0]);

              data.order =
                Number(match[0]);

            } else {

              data.order =
                Date.now();

            }

          }


          /* TOPIC */

          if (
            currentLevel === "topics"
          ) {

            data.order =
              Date.now();

          }


          if (editingId) {

            const ref =
              doc(
                getCurrentCollection(),
                editingId
              );

            await updateDoc(
              ref,
              data
            );

          } else {

            data.createdAt =
              serverTimestamp();

            await addDoc(
              getCurrentCollection(),
              data
            );

          }


          closeModal();

          await refreshCurrentLevel();

        } catch (error) {

          console.error(error);

          alert(
            "Save नहीं हुआ: " +
            error.message
          );

        } finally {

          hideLoading();

        }

      }
    );


    /* =========================
       DELETE
    ========================= */

    async function deleteItem(item) {

      const confirmDelete =
        confirm(
          `"${item.name}" को delete करना चाहते हैं?`
        );

      if (!confirmDelete) return;

      showLoading();

      try {

        await deleteDoc(
          doc(
            getCurrentCollection(),
            item.id
          )
        );

        await refreshCurrentLevel();

      } catch (error) {

        console.error(error);

        alert(
          "Delete नहीं हुआ: " +
          error.message
        );

      } finally {

        hideLoading();

      }

    }


    /* =========================
       REFRESH
    ========================= */

    async function refreshCurrentLevel() {

      if (currentLevel === "boards") {

        await showBoards();

      }

      else if (currentLevel === "classes") {

        await showClasses(
          currentBoard
        );

      }

      else if (currentLevel === "subjects") {

        await showSubjects(
          currentClass
        );

      }

      else if (currentLevel === "chapters") {

        await showChapters(
          currentSubject
        );

      }

      else if (currentLevel === "topics") {

        await showTopics(
          currentChapter
        );

      }

    }


    /* =========================
       BACK
    ========================= */

    backBtn.addEventListener(
      "click",
      async () => {

        if (currentLevel === "classes") {

          await showBoards();

        }

        else if (currentLevel === "subjects") {

          await showClasses(
            currentBoard
          );

        }

        else if (currentLevel === "chapters") {

          await showSubjects(
            currentClass
          );

        }

        else if (currentLevel === "topics") {

          await showChapters(
            currentSubject
          );

        }

      }
    );


    /* =========================
       MODAL CLOSE
    ========================= */

    cancelBtn.addEventListener(
      "click",
      closeModal
    );


    modal.addEventListener(
      "click",
      (e) => {

        if (e.target === modal) {

          closeModal();

        }

      }
    );


    function closeModal() {

      modal.classList.add("hidden");

      itemName.value = "";
      itemCode.value = "";
      editingId = null;

    }


    /* =========================
       ENTER KEY
    ========================= */

    itemName.addEventListener(
      "keydown",
      (e) => {

        if (e.key === "Enter") {

          saveBtn.click();

        }

      }
    );

  </script>

</body>
</html>
